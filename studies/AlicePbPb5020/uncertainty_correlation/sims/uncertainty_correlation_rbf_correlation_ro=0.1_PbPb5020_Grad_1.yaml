system: 'AlicePbPb5020_uncertainty_correlation_Grad_1_rbf_0.1'
description: 'ALICE Pb+Pb 5.02 TeV Grad_1; exponential experimental covariance with correlation length 0.1'

data:
  base_dir: 'data/AlicePbPb5020/lhc_predictions'
  experiment: 'experiment.csv'
  exp_error: 'exp_error.csv'

model:
  base_dir: 'model/RHICAuAu200/Au-Au-200'
  design: 'design_points.csv'
  design_ranges: 'design_ranges.csv'
  simulation: 'simulation.csv'
  validation_design: 'validation_design_points.csv'
  validation_simulation: 'validation_simulation.csv'

parameters:
  - { name: ylossParam4At2, min: 0.002, max: 2.0, label: '$y_{loss}(2)$' }
  - { name: ylossParam4At4, min: 0.004, max: 4.0, label: '$y_{loss}(4)$' }
  - { name: ylossParam4At6, min: 0.006, max: 6.0, label: '$y_{loss}(6)$' }
  - { name: ylossParam4var, min: 0.001, max: 1.0, label: '$\sigma_{y loss}$' }
  - { name: remnant_energy_loss_fraction, min: 0.001, max: 1.0, label: '$f_{remnant}$' }
  - { name: shadowing_factor, min: 0.001, max: 1.0, label: '$S$' }
  - { name: tau_form_mean, min: 0.2, max: 1.0, label: '$\tau_{form}$' }
  - { name: BG, min: 2.0, max: 25.0, label: '$B_G$' }
  - { name: string_source_sigma_x, min: 0.1, max: 0.5, label: '$\sigma_x$' }
  - { name: string_source_sigma_eta, min: 0.1, max: 0.8, label: '$\sigma_\eta$' }
  - { name: stringTransverseShiftFrac, min: 0.001, max: 1.0, label: '$f_{shift}$' }
  - { name: shear_viscosity_3_eta_over_s_T_kink_in_GeV, min: 0.13, max: 0.3, label: '$T_{\eta,kink}$' }
  - { name: shear_viscosity_3_eta_over_s_low_T_slope_in_GeV, min: -2.0, max: 1.0, label: '$a_{\eta,low}$' }
  - { name: shear_viscosity_3_eta_over_s_high_T_slope_in_GeV, min: -1.0, max: 2.0, label: '$a_{\eta,high}$' }
  - { name: shear_viscosity_3_eta_over_s_at_kink, min: 0.01, max: 0.2, label: '$(\eta/s)_{kink}$' }
  - { name: bulk_viscosity_3_zeta_over_s_max, min: 0.01, max: 0.2, label: '$(\zeta/s)_{max}$' }
  - { name: bulk_viscosity_3_zeta_over_s_T_peak_in_GeV, min: 0.12, max: 0.3, label: '$T_{\zeta,c}$' }
  - { name: bulk_viscosity_3_zeta_over_s_width_in_GeV, min: 0.025, max: 0.15, label: '$w_{\zeta}$' }
  - { name: bulk_viscosity_3_zeta_over_s_lambda_asymm, min: -0.8, max: 0.6, label: '$\lambda_{\zeta}$' }
  - { name: eps_switch, min: 0.1, max: 0.6, label: '$\epsilon_{sw}$' }

