[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hic-bayes"
version = "0.1.0"
description = "Bayesian parameter estimation for heavy-ion collision models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "emcee>=3.1",
    "ptemcee>=1.0",  # NOTE: ptemcee 1.0.0 is incompatible with numpy>=2; use emcee for now
    "h5py>=3.8",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "corner>=2.2",
    "joblib>=1.3",
    "dill>=0.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
multifidelity = ["emukit", "GPy"]
dev = ["pytest", "pytest-cov", "ipykernel", "jupyterlab", "seaborn"]

[project.scripts]
hic-bayes = "pipelines.run_analysis:main"
hic-bayes-compare-corners = "hic_bayes.plot_compare:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hic_bayes*", "pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
