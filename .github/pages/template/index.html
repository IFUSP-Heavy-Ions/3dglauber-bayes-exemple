<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>{{TITLE}}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./css/paleta_cores.css" />
  <link rel="stylesheet" href="./css/studies.css" />
  <link rel="stylesheet" href="./css/nav_bar.css" />
  <link rel="stylesheet" href="./css/pages.css" />
  <link rel="stylesheet" href="./css/home.css" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon-32x32.png">
  <script src="./js/app.js" defer></script>
</head>


<body>
  <header class="navbar">
    <div class="wrap">
      <!-- Link extra à esquerda -->
      <span class="repo-link" aria-disabled="true" title="Link indisponível">⚛</span>

      <div class="brand"><a href="./index.html">Homepage</a></div>
      <nav class="nav">
        <a href="./references.html">References</a>
        <a href="./studies.html">Studies</a>
      </nav>
    </div>
  </header>

  <main class="main">

    <!-- HERO -->
    <section class="hero" role="img" aria-label="Imagem temática do repositório">
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1 class="hero__title"> {{ TITLE_1 }} • {{ TITLE_2}} </h1>
        <p class="hero__subtitle">
          {{ SUBTITLE_1 }} • {{ SUBTITLE_2 }}
        </p>
        <a class="btn btn--light" href="./studies.html">Studies</a>
      </div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section">
      <h2>About</h2>

      <div class="card">
        <blockquote class="about-quote">
          {{ ABOUT }}
        </blockquote>

        <p class="about-link">
          {{ COURSE_LINK_BLOCK }}
        </p>

        <p class="muted">
          Last Updated at {{TIMESTAMP}} • Number of notebooks in this repository:
          <span id="nbcount">{{NBCOUNT}}</span>
        </p>

        <p class="about-contact"><a href="{{ GITHUB_LINK }}">GitHub repository</a></p>
      </div>
    </section>
  </main>
</body>

</html>
