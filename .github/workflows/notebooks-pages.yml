name: Publish notebook website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: python -m pip install -r .github/pages/requirements.txt
      - name: Render notebooks without executing cells
        run: >-
          python .github/pages/build_site.py
          --src 3dglauber-bayes-example/mcmc
          --out _site
          --template .github/pages/template
          --title "3D Glauber — Bayesian Analysis"
          --cfg .github/pages/website.yml
          --execute false
          --incremental false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
