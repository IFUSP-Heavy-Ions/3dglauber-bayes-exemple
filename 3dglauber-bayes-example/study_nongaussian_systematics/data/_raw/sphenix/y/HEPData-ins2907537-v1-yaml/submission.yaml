comment: BNL-RHIC. The pseudorapidity distribution of charged hadrons produced in
  Au+Au collisions at a center-of-mass energy of $\sqrt{s_{\scriptscriptstyle NN}}=200{\rm~GeV}$
  is measured using data collected by the sPHENIX detector. Charged hadron yields
  are extracted by counting cluster pairs in the inner and outer layers of the Intermediate
  Silicon Tracker, with corrections applied for detector acceptance, reconstruction
  efficiency, combinatorial pairs, and contributions from secondary decays. The measured
  distributions cover $|\eta|<1.1$ across various centralities, and the average pseudorapidity
  density of charged hadrons at mid-rapidity is compared to predictions from Monte
  Carlo heavy-ion event generators. This result, featuring full azimuthal coverage
  at mid-rapidity, is consistent with previous experimental measurements at the Relativistic
  Heavy Ion Collider, thereby supporting the broader sPHENIX physics program.
hepdata_doi: 10.17182/hepdata.159879.v1
